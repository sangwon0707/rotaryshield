# Copy to /etc/rotaryshield/config.yml with permissions 0640 (root:rotaryshield).
# Keep only log files that exist and are readable by the service account.
detection:
  max_retry: 5       # Warn on repeated failures; blocking starts at ban_threshold.
  ban_threshold: 10 # Ban on the tenth matching event within the time window.
  time_window: 600
  log_files:
    - /var/log/auth.log # Debian/Ubuntu; use /var/log/secure on RHEL-family systems.
  # The first capture group MUST be the source IP. IPv4 and IPv6 are accepted.
  patterns:
    ssh_failed: 'Failed password for .+ from ([0-9A-Fa-f:.]+) port [0-9]+'
    ssh_invalid: 'Invalid user .+ from ([0-9A-Fa-f:.]+) port [0-9]+'

ban:
  ban_time: 3600
  # Pin the backend so restarting cannot move existing bans to another firewall.
  # Supported: iptables, ufw, firewalld, auto.
  # UFW/firewalld require their own administrative permissions. CAP_NET_ADMIN
  # alone does not grant all permissions needed by those command-line tools.
  firewall_backend: iptables
  whitelist_ips:
    - '127.0.0.1'
    - '::1'
    # Add your own administration IP/CIDR before enabling blocking.
    # - '192.0.2.0/24'

# Legacy throttling fields are retained for configuration compatibility.
# SSH delays and HTTP request limits are not implemented.
throttling:
  ssh_delay: 1.0
  http_rate_limit: 10
  http_rate_window: 60
  max_connections: 100
  enable_captcha: false

database:
  db_path: /var/lib/rotaryshield/rotaryshield.db
  backup_enabled: false # Automatic database backups are not scheduled yet.

log_level: INFO
log_file: /var/log/rotaryshield/rotaryshield.log
pid_file: /run/rotaryshield/rotaryshield.pid
